# CI-only TLS termination fixture. Not a production deployment template.
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    server_tokens off;
    access_log off;
    error_log /dev/stderr warn;
    limit_req_zone $binary_remote_addr zone=dav_smoke_ip:1m rate=3r/s;

    server {
        listen 443 ssl;
        server_name dav.test;
        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        add_header Strict-Transport-Security "max-age=3600" always;
        client_max_body_size 64m;
        client_body_timeout 20s;
        client_header_timeout 20s;
        limit_req_status 429;

        location / {
            limit_req zone=dav_smoke_ip burst=10 nodelay;
            proxy_pass http://goreecloud-dav-tls-backend:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # CRITICAL: replace, never forward client-supplied identity/TLS headers.
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";
            proxy_request_buffering on;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
